  <g opacity="0.18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#67E8F9">
    <text x="1375" y="58">01  // Build with intent.</text>
    <text x="1375" y="91">02  // Ship with confidence.</text>
    <text x="1375" y="157">04  async function build(feature) {</text>
    <text x="1375" y="190">05    const plan = await planWork(feature);</text>
    <text x="1375" y="223">06    const tickets = await createTickets(plan);</text>
    <text x="1375" y="256">07    await execute(tickets);</text>
    <text x="1375" y="289">08    const results = await verify();</text>
    <text x="1375" y="322">09    return await review(results);</text>
    <text x="1375" y="355">10  }</text>
  </g>

